name: Build NvaPrime (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["[0-9]*"]   # etiket = ürün sürümü (config.json -> appVersion), ör. 1.4.6-2

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

permissions:
  contents: write

jobs:
  config:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.c.outputs.tag }}
      name: ${{ steps.c.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          echo "tag=$(node -p "require('./config.json').upstreamTag")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./config.json').appName")" >> "$GITHUB_OUTPUT"

  bridge:
    needs: config
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: rustdesk } }
    steps:
      - uses: actions/checkout@v4
        with: { path: . }
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ needs.config.outputs.tag }}
          submodules: recursive
          path: rustdesk
      - name: Apply NvaPrime patches
        working-directory: .
        run: node patch/apply-branding.mjs rustdesk
      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - uses: dtolnay/rust-toolchain@v1
        with: { toolchain: "${{ env.RUST_VERSION }}", components: rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { prefix-key: bridge, workspaces: rustdesk }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "${{ env.BRIDGE_FLUTTER_VERSION }}", cache: true }
      - name: Install bridge tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter && sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml && flutter pub get && popd
      - name: Generate bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart
            rustdesk/flutter/macos/Runner/bridge_generated.h
            rustdesk/flutter/ios/Runner/bridge_generated.h

  topmost:
    runs-on: windows-2022
    steps:
      - uses: microsoft/setup-msbuild@v2
      - name: Build WindowInjection.dll
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow
          git checkout 53b548a5398624f7149a382000397993542ad796
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
      - uses: actions/upload-artifact@v4
        with:
          name: topmostwindow
          path: RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll

  windows:
    needs: [config, bridge, topmost]
    runs-on: windows-2022
    env:
      APP: ${{ needs.config.outputs.name }}
    defaults: { run: { shell: bash, working-directory: rustdesk } }
    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with: { path: . }
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ needs.config.outputs.tag }}
          submodules: recursive
          path: rustdesk
      - name: Apply NvaPrime patches
        working-directory: .
        run: node patch/apply-branding.mjs rustdesk
      - uses: actions/download-artifact@v4
        with: { name: bridge-artifact, path: rustdesk }
      - uses: KyleMayes/install-llvm-action@v1
        with: { version: "${{ env.LLVM_VERSION }}" }
      - uses: subosito/flutter-action@v2.12.0
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - name: Use RustDesk custom flutter engine
        shell: pwsh
        working-directory: .
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
      - name: Patch flutter
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { prefix-key: windows-2022, workspaces: rustdesk }
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg dependencies
        env: { VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static }
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi
      - name: Build
        shell: pwsh
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./dist
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./dist
      - uses: actions/download-artifact@v4
        with: { name: topmostwindow, path: rustdesk/dist }
      - name: Sanity check
        run: |
          ls dist
          test -f "dist/${APP}.exe" || { echo "HATA: dist/${APP}.exe yok (exe adi APP_NAME ile ayni olmali)"; exit 1; }
          test -f dist/librustdesk.dll
      - name: Copy Runner.res
        continue-on-error: true
        run: |
          r=$(find . -name "Runner.res" | head -1); [ -n "$r" ] && cp "$r" ./libs/portable/Runner.res
      - name: Build self-extracting installer
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../dist/ -o . -e ../../dist/${APP}.exe
          popd
          VER=$(node -p "require('../config.json').appVersion")
          mkdir -p ../out
          # Ad "install.exe" ile bitmeli: cift tiklayinca kurulum ekrani acilir; digeri tasinabilir (portable) calisir
          cp target/release/rustdesk-portable-packer.exe "../out/${APP}-${VER}-install.exe"
          cp target/release/rustdesk-portable-packer.exe "../out/${APP}-${VER}-portable.exe"
          cd ../out && sha256sum *.exe | tee SHA256SUMS.txt
      - name: Sign update package
        working-directory: .
        env:
          NVA_UPDATE_SIGNING_KEY: ${{ secrets.NVA_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$NVA_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::NVA_UPDATE_SIGNING_KEY tanimli degil: guncelleme imzasi uretilmedi, otomatik guncelleme calismaz."
            exit 0
          fi
          VER=$(node -p "require('./config.json').appVersion")
          node patch/sign-update.mjs "out/${APP}-${VER}-portable.exe"
          ls -l out

      - name: Source archive (AGPL-3.0 corresponding source)
        working-directory: .
        run: |
          VER=$(node -p "require('./config.json').appVersion")
          cd rustdesk
          git -c safe.directory='*' ls-files -z --recurse-submodules | xargs -0 tar --transform "s,^,${APP}-source-${VER}/," -czf ../out/${APP}-source-${VER}.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: nvaprime-windows, path: out }
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: |
          VER=$(node -p "require('./config.json').appVersion")
          if [ "${GITHUB_REF_NAME}" != "$VER" ]; then echo "::error::Etiket (${GITHUB_REF_NAME}) config.json appVersion ($VER) ile ayni olmali"; exit 1; fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: false
          files: out/*
